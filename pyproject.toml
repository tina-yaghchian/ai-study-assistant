[project]
name = "ai-study-assistant"
version = "1.0.0"
description = "Local RAG study assistant: lecture PDFs to notes, quizzes and cited answers."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
